# /etc/nginx/sites-available/horizonte-portal.conf — Portal para padres: PHP-FPM + API por proxy inverso
server {
    listen 80;
    listen [::]:80;
    server_name portal.horizonte.internal;

    # Solo la carpeta public/ es visible desde la web; app/ (código y datos) queda fuera
    root  /srv/horizonte/portal/public;
    index index.php;

    access_log /var/log/nginx/horizonte-portal.access.log horizonte;
    error_log  /var/log/nginx/horizonte-portal.error.log warn;

    client_max_body_size 2m;                 # formularios pequeños; frena envíos gigantes

    location / {
        try_files $uri $uri/ =404;
    }

    # 1) FastCGI: Nginx pasa los .php a PHP-FPM por un socket Unix
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 2) Proxy inverso HTTP: /api/ lo atiende otro programa (servicio horizonte-eco en 127.0.0.1:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }

    # Si PHP-FPM o la API se caen (502/504), el padre ve la página de mantenimiento, no un error técnico
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /srv/horizonte/www;
        internal;
    }
}
