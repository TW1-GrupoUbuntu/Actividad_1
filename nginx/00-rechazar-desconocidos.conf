# /etc/nginx/sites-available/00-rechazar-desconocidos.conf
# Si alguien llega por IP o con un nombre que no es nuestro, cerramos la conexión sin responder.
# Reemplaza al sitio "default" de Nginx.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/desconocidos.access.log;
    return 444;
}
